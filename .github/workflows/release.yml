# SPDX-License-Identifier: MIT
#
# Releases the plugin when what it publishes changed. It runs after each
# successful check of a push to main (and when started by hand, or by
# update.yml after it pushes an upstream bump), so a commit is released
# only once its checks passed.
#
# Versions are <series>.<revision>, the series in .github/release/series
# and the revision counted by the tags of that series: v0.1.1, v0.1.2, and
# so on. (Builds from source, which every lockfile in this repository is
# made with, have the version in build.sbt, 0.1.0.) The run builds the
# artifacts of the commit with the last release's version and compares
# their SHA256SUMS with the SHA256SUMS of that release. The plugin build
# is reproducible, so equal sums mean nothing a user receives changed,
# whether the commit moved a pin (nixpkgs, sbt) or changed code, and the
# run ends. Otherwise it builds them with the next revision and publishes
# them:
#
#  - into the Maven repository on the gh-pages branch, which GitHub Pages
#    serves at https://clhodapp.github.io/sbt-nix-backend/maven
#    (.github/release/pages.sh);
#  - as a GitHub release tagged v<version> at the commit, with the
#    artifacts as a zip in Maven layout and their SHA256SUMS.
#
# A new series (a manual edit of .github/release/series) starts at
# revision 1.
name: release

on:
  workflow_run:
    workflows: [check]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to release; main's head when empty
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # A check that main dispatched for a pull request also reports main's
    # head, so only a check of a push counts.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: clhodapp
          skipPush: true
          extraPullNames: nix-community,numtide

      - name: Decide the version
        id: decide
        run: |
          set -euo pipefail
          series=$(cat .github/release/series)
          last=$(git tag -l "v$series.*" | sort -V | tail -n 1)
          if [[ -z $last ]]; then
            echo "version=$series.1" >>"$GITHUB_OUTPUT"
            echo "release=true" >>"$GITHUB_OUTPUT"
            echo "No release of series $series yet."
            exit 0
          fi
          .github/release/build.sh "${last#v}" "$RUNNER_TEMP/last"
          gh release download "$last" --pattern SHA256SUMS --dir "$RUNNER_TEMP/released"
          if cmp -s "$RUNNER_TEMP/last/SHA256SUMS" "$RUNNER_TEMP/released/SHA256SUMS"; then
            echo "release=false" >>"$GITHUB_OUTPUT"
            echo "$SHA builds what $last published; nothing to release."
            exit 0
          fi
          echo "What $SHA builds differs from $last:"
          diff "$RUNNER_TEMP/released/SHA256SUMS" "$RUNNER_TEMP/last/SHA256SUMS" || true
          revision=${last##*.}
          echo "version=$series.$((revision + 1))" >>"$GITHUB_OUTPUT"
          echo "release=true" >>"$GITHUB_OUTPUT"

      - name: Build the release
        if: steps.decide.outputs.release == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          .github/release/build.sh "$VERSION" "$RUNNER_TEMP/release"
          (cd "$RUNNER_TEMP/release" && zip -qr "$RUNNER_TEMP/sbt-nix-backend-$VERSION-maven.zip" . -x SHA256SUMS)

      - name: Publish to the Maven repository on GitHub Pages
        if: steps.decide.outputs.release == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          site="$RUNNER_TEMP/site"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git worktree add "$site" origin/gh-pages
            git -C "$site" switch -c gh-pages
          else
            git worktree add --orphan -b gh-pages "$site"
          fi
          .github/release/pages.sh "$site" "$RUNNER_TEMP/release"
          git -C "$site" add -A
          git -C "$site" commit -q -m "release: $VERSION"
          git -C "$site" push origin gh-pages

      - name: Create the release
        if: steps.decide.outputs.release == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          nixpkgs=$(jq -r '.nodes[.nodes.root.inputs.nixpkgs].locked.rev' flake.lock)
          sbt1=$(grep -oP 'case "2\.12" => "\K[^"]+' build.sbt)
          sbt2=$(grep -oP 'case _ +=> "\K[^"]+' build.sbt)
          {
            echo "sbt-nix-backend $VERSION, built in the Nix sandbox from $SHA."
            echo
            echo "Install it in \`project/plugins.sbt\` (or in the meta-most build of a build that has several):"
            echo
            echo '```scala'
            echo 'resolvers += "sbt-nix-backend" at "https://clhodapp.github.io/sbt-nix-backend/maven"'
            echo "addSbtPlugin(\"io.github.clhodapp\" % \"sbt-nix-backend\" % \"$VERSION\")"
            echo '```'
            echo
            echo "The artifacts are also attached here, as a zip in Maven layout with their SHA256SUMS."
            echo
            echo "| Built against | Version |"
            echo "|---|---|"
            echo "| nixpkgs | \`$nixpkgs\` |"
            echo "| sbt 1 | $sbt1 |"
            echo "| sbt 2 | $sbt2 |"
          } >"$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --target "$SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP/sbt-nix-backend-$VERSION-maven.zip" "$RUNNER_TEMP/release/SHA256SUMS"
