# SPDX-License-Identifier: MIT
#
# Runs the test suite on both systems the flake supports, on every push to
# main, on every pull request, and when update.yml dispatches it. The
# flake's checks include the conformance checks of the purifier contract
# that the sandbox can run; the ones that need the network or a Nix daemon
# are the jobs of their names here. release.yml releases after a
# successful run of this workflow on a push to main.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      # The clhodapp cache, read only, holds builds of earlier runs.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: clhodapp
          skipPush: true
      - name: Flake checks
        run: nix flake check --print-build-logs

  # Relocking the fixtures reproduces their lockfiles byte for byte. The
  # consumer fixture locks the producer flake on GitHub at a pushed commit,
  # so tests/relock-fixtures.sh leaves it out here.
  conformance-relock:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: clhodapp
          skipPush: true
      - name: Relock the fixtures
        run: |
          SECONDS=0
          nix develop --command tests/relock-fixtures.sh --relock --skip-consumer
          echo "the relock took ${SECONDS}s"
          git diff --exit-code

  # The everyday loop of the fixtures works with the network cut off.
  conformance-offline:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: clhodapp
          skipPush: true
      - name: Interactive tests
        run: tests/interactive.sh

  conformance-update:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: clhodapp
          skipPush: true
      - name: Update moves the pinned producer
        run: tests/update.sh
